# QwenPaw 便携模式配置示例
# 用于 ~/.qwenpaw/config.yaml 或U盘 config/ 目录
# ========================================

portable:
  enabled: true
  # 数据存储路径（便携模式自动设置为U盘路径）
  data_dir: "./data"
  config_dir: "./config"
  models_dir: "./models"
  logs_dir: "./logs"

# 模型配置
model:
  # 运行模式: online | local
  mode: "online"
  # 默认本地模型名称（离线模式时使用）
  default_local_model: "QwenPaw-Flash-2B"
  # 推理后端: auto | llama.cpp | ollama
  inference_backend: "auto"
  # GPU 加速
  gpu_accel: true

# 在线 API 配置
api:
  provider: "dashscope"
  # api_key: "sk-xxx"  # 建议通过环境变量设置，不要明文写入

# 聊天渠道配置
channels:
  # 钉钉
  # dingtalk:
  #   app_key: ""
  #   app_secret: ""
  # 飞书
  # feishu:
  #   app_id: ""
  #   app_secret: ""
  # QQ
  # qq:
  #   app_id: ""
  #   token: ""

# 安全配置
security:
  tool_guard: true      # 工具守卫
  file_guard: true      # 文件防护
  skill_scan: true      # 技能安全扫描
  allowed_paths:
    - "./data"
    - "./models"

# 日志配置
logging:
  level: "info"
  max_size_mb: 50
  backup_count: 3
